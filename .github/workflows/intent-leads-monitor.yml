name: DGS Buyer-Intent Lead Discovery Monitor

on:
  schedule:
    # Runs every 6 hours at minute 45 UTC
    - cron: '45 */6 * * *'
  workflow_dispatch:

jobs:
  discover_buyer_intent_leads:
    name: Discover & Qualify Buyer-Intent Leads
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger DGS Buyer-Intent Lead Discovery API
        env:
          DGS_CRON_SECRET: ${{ secrets.DGS_CRON_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$DGS_CRON_SECRET" ]; then
            echo "::error::DGS_CRON_SECRET is not set in GitHub Actions repository secrets."
            exit 1
          fi

          ENDPOINT="https://www.dgeniussolutions.com/api/internal/intent-leads/check"
          START_MS=$(date +%s%3N)

          set +e
          HTTP_STATUS=$(curl -sS -o /tmp/intent_leads_response.json -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 75 \
            --retry 2 \
            --retry-delay 3 \
            -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $DGS_CRON_SECRET" \
            -H "X-GitHub-Run-Id: $GITHUB_RUN_ID" \
            -H "Content-Type: application/json" \
            -H "User-Agent: DGS-GitHub-Cron/1.0 (buyer-intent-lead-monitor)")
          CURL_EXIT=$?
          set -e

          END_MS=$(date +%s%3N)
          DURATION_MS=$((END_MS - START_MS))

          echo "=========================================="
          echo "Cron: buyer-intent-lead-monitor"
          echo "Endpoint: /api/internal/intent-leads/check"
          echo "HTTP: $HTTP_STATUS (curl_exit=$CURL_EXIT)"
          echo "Duration: ${DURATION_MS}ms"
          echo "Response:"
          cat /tmp/intent_leads_response.json 2>/dev/null || echo "(no response body)"
          echo ""
          echo "=========================================="

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Buyer-Intent Lead Discovery cron failed (HTTP $HTTP_STATUS, curl_exit=$CURL_EXIT)"
            exit 1
          fi
