name: DGS Static Site Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Build and code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint, typecheck and build
        run: npm run check
