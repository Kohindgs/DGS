name: DGS Headless Production Go-Live

on:
  push:
    branches:
      - deploy/headless-go-live-fa4fdb6
  workflow_dispatch:

permissions:
  contents: read

env:
  PROD_HOST: 147.93.100.126
  PROD_PORT: '65002'
  PROD_USER: u188101251
  PROD_ROOT: /home/u188101251/production-app
  HOSTINGER_PASS: ${{ secrets.HOSTINGER_PASS }}
  HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
  HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated release
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          DGS_PUBLIC_INDEXING=true DGS_ADMIN_ENABLED=true npm run build
          test -f .next/server/app/blogs/seo-company-in-mumbai.html
          test -f .next/server/app/blogs/google-ads-ai-max-2026.html
          test -f .next/server/app/blogs/aeo-in-2026.html
          test -f .next/server/app/portfolio.html
          grep -F '<meta name="robots" content="index, follow"/>' .next/server/app/index.html
          grep -F '<meta name="googlebot" content="index, follow' .next/server/app/index.html

      - name: Prepare SSH authentication
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 1. Pinned Host Key with Retry ssh-keyscan fallback
          if [ -n "$HOSTINGER_KNOWN_HOSTS" ]; then
            echo "Using trusted pinned HOSTINGER_KNOWN_HOSTS..."
            printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          else
            echo "HOSTINGER_KNOWN_HOSTS secret not set; scanning host keys with retry..."
            scan_success=false
            for attempt in 1 2 3 4 5; do
              echo "Host key scan attempt $attempt/5..."
              if ssh-keyscan -T 10 -p "$PROD_PORT" "$PROD_HOST" > /tmp/hostkeys 2>/dev/null; then
                if [ -s /tmp/hostkeys ]; then
                  cat /tmp/hostkeys >> ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts
                  scan_success=true
                  echo "ssh-keyscan succeeded on attempt $attempt"
                  break
                fi
              fi
              sleep 5
            done
            if [ "$scan_success" != "true" ]; then
              echo "ERROR: Failed to retrieve Hostinger SSH host keys after 5 attempts."
              exit 1
            fi
          fi

          # 2. Private Key Preparation & Validation
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
              echo "ERROR: HOSTINGER_SSH_KEY secret is invalid or malformed."
              exit 1
            fi
            echo "AUTH_MODE=key" >> "$GITHUB_ENV"
          elif [ -n "$HOSTINGER_PASS" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            echo "AUTH_MODE=password" >> "$GITHUB_ENV"
          else
            echo "No Hostinger SSH secret is configured. Refusing production changes."
            exit 78
          fi

      - name: Verify production access
        run: |
          ssh_connected=false
          for attempt in 1 2 3 4 5; do
            echo "Testing production SSH access (attempt $attempt/5)..."
            if [ "$AUTH_MODE" = key ]; then
              if ssh -p "$PROD_PORT" -o BatchMode=yes -o ConnectTimeout=10 "$PROD_USER@$PROD_HOST" "readlink -f $PROD_ROOT/current"; then
                ssh_connected=true
                break
              fi
            else
              if sshpass -p "$HOSTINGER_PASS" ssh -p "$PROD_PORT" -o ConnectTimeout=10 "$PROD_USER@$PROD_HOST" "readlink -f $PROD_ROOT/current"; then
                ssh_connected=true
                break
              fi
            fi
            echo "SSH connection attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          if [ "$ssh_connected" != "true" ]; then
            echo "ERROR: Failed to establish production SSH access after 5 attempts."
            exit 1
          fi

      - name: Synchronize production secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          DGS_ENCRYPTION_KEY: ${{ secrets.DGS_ENCRYPTION_KEY }}
        run: |
          set +x
          # 1. Verify all 5 GitHub secret variables are non-empty
          missing=0
          for var in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI PAGESPEED_API_KEY DGS_ENCRYPTION_KEY; do
            val="${!var:-}"
            if [ -n "$val" ]; then
              echo "$var=CONFIGURED"
            else
              echo "ERROR: $var is missing or empty"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo "Refusing to proceed: $missing secret(s) missing"
            exit 1
          fi

          # 2. Create secure temporary env payload
          TMP_PAYLOAD="$(mktemp /tmp/dgs-secrets-XXXXXX.env)"
          chmod 600 "$TMP_PAYLOAD"
          trap 'rm -f "$TMP_PAYLOAD" /tmp/remote-merge-secrets.sh' EXIT

          printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID" >> "$TMP_PAYLOAD"
          printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET" >> "$TMP_PAYLOAD"
          printf 'GOOGLE_REDIRECT_URI=%s\n' "$GOOGLE_REDIRECT_URI" >> "$TMP_PAYLOAD"
          printf 'PAGESPEED_API_KEY=%s\n' "$PAGESPEED_API_KEY" >> "$TMP_PAYLOAD"
          printf 'DGS_ENCRYPTION_KEY=%s\n' "$DGS_ENCRYPTION_KEY" >> "$TMP_PAYLOAD"

          # 3. SCP it to Hostinger
          REMOTE_PAYLOAD="$PROD_ROOT/shared/.secrets-incoming-$$.env"
          scp_uploaded=false
          for attempt in 1 2 3; do
            echo "Uploading secrets payload to production (attempt $attempt/3)..."
            if [ "$AUTH_MODE" = key ]; then
              if scp -P "$PROD_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$TMP_PAYLOAD" "$PROD_USER@$PROD_HOST:$REMOTE_PAYLOAD"; then
                scp_uploaded=true
                break
              fi
            else
              if sshpass -p "$HOSTINGER_PASS" scp -P "$PROD_PORT" -o ConnectTimeout=15 "$TMP_PAYLOAD" "$PROD_USER@$PROD_HOST:$REMOTE_PAYLOAD"; then
                scp_uploaded=true
                break
              fi
            fi
            echo "SCP upload attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          if [ "$scp_uploaded" != "true" ]; then
            echo "ERROR: Failed to upload secrets payload after 3 attempts."
            exit 1
          fi

          # 4. Merge into shared/.env.production
          cat > /tmp/remote-merge-secrets.sh << 'REMOTE'
          set -euo pipefail
          ROOT=/home/u188101251/production-app
          SHARED_ENV="$ROOT/shared/.env.production"
          INCOMING="$1"

          cleanup() {
            rm -f "$INCOMING" "${MERGED_TMP:-}"
          }
          trap cleanup EXIT

          if [ ! -f "$SHARED_ENV" ]; then
            echo "Missing production env: $SHARED_ENV"
            exit 78
          fi

          if [ ! -f "$INCOMING" ]; then
            echo "Missing incoming secrets payload: $INCOMING"
            exit 78
          fi

          # Create a timestamped backup of shared/.env.production
          BACKUP="$ROOT/shared/.env.production.backup-$(date -u +%Y%m%d%H%M%S)"
          cp -p "$SHARED_ENV" "$BACKUP"
          chmod 600 "$BACKUP"
          echo "Created backup: $BACKUP"

          # Working copy for atomic update
          MERGED_TMP="$(mktemp "$ROOT/shared/.env.tmp.XXXXXX")"
          chmod 600 "$MERGED_TMP"
          cp "$SHARED_ENV" "$MERGED_TMP"

          # Update each variable idempotently:
          # - remove old line if present
          # - add current value once
          # - no duplicate env keys
          keys=(
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            GOOGLE_REDIRECT_URI
            PAGESPEED_API_KEY
            DGS_ENCRYPTION_KEY
          )

          for k in "${keys[@]}"; do
            line="$(grep "^${k}=" "$INCOMING" | head -n 1 || true)"
            if [ -n "$line" ]; then
              grep -v "^${k}=" "$MERGED_TMP" > "${MERGED_TMP}.clean" || true
              mv "${MERGED_TMP}.clean" "$MERGED_TMP"
              printf '%s\n' "$line" >> "$MERGED_TMP"
            fi
          done

          # Verify all 5 keys are present in merged file without exposing values
          all_ok=true
          for k in "${keys[@]}"; do
            if ! grep -q "^${k}=." "$MERGED_TMP"; then
              echo "Verification failed for $k in merged env"
              all_ok=false
            fi
          done

          if [ "$all_ok" != "true" ]; then
            echo "Failed to verify synchronized secrets in merged env. Aborting."
            exit 1
          fi

          # Atomically replace shared/.env.production and set chmod 600
          mv "$MERGED_TMP" "$SHARED_ENV"
          chmod 600 "$SHARED_ENV"
          echo "Production shared environment secrets synchronized successfully (chmod 600)."
          REMOTE

          if [ "$AUTH_MODE" = key ]; then
            ssh -p "$PROD_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" "bash -s -- '$REMOTE_PAYLOAD'" < /tmp/remote-merge-secrets.sh
          else
            sshpass -p "$HOSTINGER_PASS" ssh -p "$PROD_PORT" -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" "bash -s -- '$REMOTE_PAYLOAD'" < /tmp/remote-merge-secrets.sh
          fi

          # 5. Remove temporary secret payload locally and remotely
          rm -f "$TMP_PAYLOAD" /tmp/remote-merge-secrets.sh

      - name: Package validated release
        run: |
          BUILD_ID="$(cat .next/BUILD_ID)"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          tar -czf /tmp/dgs-prod-release.tar.gz \
            --exclude='.next/cache' \
            --exclude='public/media/portfolio/videos' \
            --exclude='*.mp4' \
            .next app components data db lib public scripts \
            middleware.ts next.config.ts next-env.d.ts \
            package.json package-lock.json server.js tsconfig.json

      - name: Upload release
        run: |
          scp_uploaded=false
          for attempt in 1 2 3; do
            echo "Uploading release archive to production (attempt $attempt/3)..."
            if [ "$AUTH_MODE" = key ]; then
              if scp -P "$PROD_PORT" -o BatchMode=yes -o ConnectTimeout=15 /tmp/dgs-prod-release.tar.gz "$PROD_USER@$PROD_HOST:/tmp/dgs-prod-release.tar.gz"; then
                scp_uploaded=true
                break
              fi
            else
              if sshpass -p "$HOSTINGER_PASS" scp -P "$PROD_PORT" -o ConnectTimeout=15 /tmp/dgs-prod-release.tar.gz "$PROD_USER@$PROD_HOST:/tmp/dgs-prod-release.tar.gz"; then
                scp_uploaded=true
                break
              fi
            fi
            echo "SCP upload attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          if [ "$scp_uploaded" != "true" ]; then
            echo "ERROR: Failed to upload release archive after 3 attempts."
            exit 1
          fi

      - name: Atomic production activation
        run: |
          cat > /tmp/remote-deploy.sh <<'REMOTE'
          set -euo pipefail
          ROOT=/home/u188101251/production-app
          PREVIOUS="$(readlink -f "$ROOT/current")"
          RELEASE="$ROOT/releases/fa4fdb6-${BUILD_ID}-$(date -u +%Y%m%d%H%M%S)"
          echo "$PREVIOUS" > "$ROOT/previous-before-fa4fdb6.txt"
          mkdir -p "$RELEASE/tmp"
          tar -xzf /tmp/dgs-prod-release.tar.gz -C "$RELEASE"
          rm -f /tmp/dgs-prod-release.tar.gz
          ln -sfn "$ROOT/shared/node_modules" "$RELEASE/node_modules"
          SHARED_ENV="$ROOT/shared/.env.production"
          if [ ! -f "$SHARED_ENV" ]; then
            echo "Missing persistent production config: $SHARED_ENV"
            exit 78
          fi
          cp "$SHARED_ENV" "$RELEASE/.env.production"
          {
            echo "DGS_PUBLIC_INDEXING=true"
            echo "DGS_WORDPRESS_BACKEND_ORIGIN=https://wp-origin.dgeniussolutions.com"
            echo "NEXT_PUBLIC_SITE_URL=https://www.dgeniussolutions.com"
            echo "DGS_ADMIN_ENABLED=true"
            echo "DGS_PRIVATE_UPLOAD_DIR=$ROOT/shared/private/careers"
            echo "DGS_CMS_MEDIA_DIR=$ROOT/shared/cms-media"
          } >> "$RELEASE/.env.production"
          chmod 600 "$RELEASE/.env.production"
          if [ -d "$ROOT/shared/wp-content/uploads" ]; then
            find "$ROOT/shared/wp-content/uploads" -type f -name "*.mp4" | while read -r f; do
              rel="${f#$ROOT/shared/wp-content/uploads/}"
              target="$RELEASE/public/wp-content/uploads/$rel"
              mkdir -p "$(dirname "$target")"
              ln -sfn "$f" "$target"
            done
          fi
          if [ -d "$ROOT/shared/media/portfolio/videos" ]; then
            mkdir -p "$RELEASE/public/media/portfolio/videos"
            find "$ROOT/shared/media/portfolio/videos" -type f | while read -r f; do
              ln -sfn "$f" "$RELEASE/public/media/portfolio/videos/$(basename "$f")"
            done
          fi
          mkdir -p "$ROOT/shared/private/careers" "$ROOT/shared/cms-media"
          chmod 700 "$ROOT/shared/private" "$ROOT/shared/private/careers"
          required_keys=(
            DGS_ADMIN_EMAIL
            DGS_ADMIN_PASSWORD
            DGS_ADMIN_SESSION_SECRET
            DGS_SMTP_HOST
            DGS_SMTP_USER
            DGS_SMTP_PASSWORD
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            GOOGLE_REDIRECT_URI
            PAGESPEED_API_KEY
            DGS_ENCRYPTION_KEY
          )
          for key in "${required_keys[@]}"; do
            if ! grep -q "^${key}=." "$RELEASE/.env.production"; then
              echo "Missing required production setting: $key"
              exit 78
            fi
          done
          if ! grep -Eq '^(DGS_DATABASE_URL|DGS_MYSQL_HOST)=.' "$RELEASE/.env.production"; then
            echo "Missing CMS database configuration"
            exit 78
          fi
          cd "$RELEASE"
          npm run cms:schema:apply
          test "$(cat "$RELEASE/.next/BUILD_ID")" = "$BUILD_ID"
          test -f "$RELEASE/.next/server/app/blogs/seo-company-in-mumbai.html"
          test -f "$RELEASE/.next/server/app/blogs/google-ads-ai-max-2026.html"
          test -f "$RELEASE/.next/server/app/blogs/aeo-in-2026.html"
          test -f "$RELEASE/.next/server/app/portfolio.html"
          grep -q 'name="robots" content="index, follow"' "$RELEASE/.next/server/app/index.html"
          grep -q 'name="googlebot" content="index, follow' "$RELEASE/.next/server/app/index.html"
          ln -sfn "$RELEASE" "$ROOT/current_new"
          mv -Tf "$ROOT/current_new" "$ROOT/current"
          touch "$ROOT/current/tmp/restart.txt"
          echo "DEPLOYED_RELEASE=$RELEASE"
          REMOTE
          if [ "$AUTH_MODE" = key ]; then
            ssh -p "$PROD_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" "BUILD_ID='$BUILD_ID' bash -s" < /tmp/remote-deploy.sh
          else
            sshpass -p "$HOSTINGER_PASS" ssh -p "$PROD_PORT" -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" "BUILD_ID='$BUILD_ID' bash -s" < /tmp/remote-deploy.sh
          fi

          echo "DEPLOY_SWITCHED=true" >> "$GITHUB_ENV"

      - name: Verify live production
        run: |
          # 1. Warmup Readiness Loop (probe up to 90 seconds)
          echo "Waiting for production Passenger/Node readiness..."
          warmup_ok=false
          for i in $(seq 1 45); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' 'https://www.dgeniussolutions.com/' || echo "000")"
            if [ "$code" = "200" ]; then
              echo "Production application ready after $((i * 2))s (HTTP 200)."
              warmup_ok=true
              break
            fi
            sleep 2
          done
          if [ "$warmup_ok" != "true" ]; then
            echo "ERROR: Production application failed to become ready within 90 seconds."
            exit 1
          fi

          # 2. Verification Helpers with Retries
          check_status() {
            local url="$1"
            local expected="$2"
            local passed=false
            local last_code=""
            for attempt in 1 2 3; do
              last_code="$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo "000")"
              if [ "$last_code" = "$expected" ]; then
                echo "✓ [$last_code] $url (attempt $attempt)"
                passed=true
                break
              fi
              echo "  [Attempt $attempt] $url: expected $expected, got $last_code. Retrying in 2s..."
              sleep 2
            done
            if [ "$passed" != "true" ]; then
              echo "FAIL: $url expected HTTP $expected but received HTTP $last_code after 3 attempts"
              return 1
            fi
          }

          check_redirect() {
            local url="$1"
            local expected_dest="$2"
            local passed=false
            local last_code=""
            local last_loc=""
            for attempt in 1 2 3; do
              last_code="$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo "000")"
              last_loc="$(curl -sS -I "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}' || true)"
              if [ "$last_code" = "301" ] && [ "$last_loc" = "$expected_dest" ]; then
                final_code="$(curl -sS -o /dev/null -w '%{http_code}' "$expected_dest" || echo "000")"
                if [ "$final_code" = "200" ]; then
                  echo "✓ [301 -> 200] $url -> $last_loc (attempt $attempt)"
                  passed=true
                  break
                fi
              fi
              echo "  [Attempt $attempt] $url: expected 301 -> $expected_dest, got $last_code -> $last_loc. Retrying in 2s..."
              sleep 2
            done
            if [ "$passed" != "true" ]; then
              echo "FAIL: Redirect verification failed for $url (Status: $last_code, Location: $last_loc)"
              return 1
            fi
          }

          # 3. HTTP 200 Route Verification
          echo "Verifying HTTP 200 routes..."
          routes_200=(
            'https://www.dgeniussolutions.com/'
            'https://www.dgeniussolutions.com/services/seo-services-in-mumbai/'
            'https://www.dgeniussolutions.com/services/aeo-services-in-mumbai/'
            'https://www.dgeniussolutions.com/services/geo/'
            'https://www.dgeniussolutions.com/services/llm-seo-service/'
            'https://www.dgeniussolutions.com/services/ai-video-production-agency/'
            'https://www.dgeniussolutions.com/services/performance-marketing/'
            'https://www.dgeniussolutions.com/services/dubai-seo/'
            'https://www.dgeniussolutions.com/aeo-dubai/'
            'https://www.dgeniussolutions.com/services/ai-production-dubai-page/'
            'https://www.dgeniussolutions.com/australia-page/'
            'https://www.dgeniussolutions.com/us-landing-page/'
            'https://www.dgeniussolutions.com/career/'
            'https://www.dgeniussolutions.com/career/generative-ai-artist/'
            'https://www.dgeniussolutions.com/portfolio/'
            'https://www.dgeniussolutions.com/seo-executive-assessment/'
            'https://www.dgeniussolutions.com/seo-manager-assessment/'
            'https://www.dgeniussolutions.com/admin/login/'
            'https://www.dgeniussolutions.com/blogs/seo-company-in-mumbai/'
            'https://www.dgeniussolutions.com/blogs/google-ads-ai-max-2026/'
            'https://www.dgeniussolutions.com/blogs/aeo-in-2026/'
            'https://www.dgeniussolutions.com/robots.txt'
            'https://www.dgeniussolutions.com/sitemap.xml'
          )
          for u in "${routes_200[@]}"; do
            check_status "$u" 200
          done

          # 4. 301 Permanent Redirect Route
          echo "Verifying permanent redirects..."
          check_redirect 'https://www.dgeniussolutions.com/career/junior-hr-generalist/' 'https://www.dgeniussolutions.com/career/'

          # 5. WordPress Retired Lockdown Routes (HTTP 403)
          echo "Verifying WordPress retirement lockdown..."
          check_status 'https://www.dgeniussolutions.com/wp-login.php' 403
          check_status 'https://www.dgeniussolutions.com/wp-admin/' 403
          check_status 'https://www.dgeniussolutions.com/xmlrpc.php' 403
          check_status 'https://www.dgeniussolutions.com/wp-cron.php' 403
          check_status 'https://www.dgeniussolutions.com/wp-json/' 403

          # 6. Indexing & Robot Tag Verification
          echo "Verifying home page robots meta tags..."
          live_home="$(curl -sS 'https://www.dgeniussolutions.com/')"
          echo "$live_home" | grep -F '<meta name="robots" content="index, follow"/>'
          echo "$live_home" | grep -F '<meta name="googlebot" content="index, follow'

          # 7. Google & PageSpeed Integration State Verification
          echo "Verifying Google & PageSpeed integration state on production..."
          cat > /tmp/remote-verify-integrations.sh << 'REMOTE'
          set -euo pipefail
          node -e "
          const fs = require('fs');
          const content = fs.readFileSync('/home/u188101251/production-app/current/.env.production', 'utf8');
          const env = {};
          for (const line of content.split(/\r?\n/)) {
            const m = line.match(/^([A-Za-z0-9_]+)=(.*)$/);
            if (m) env[m[1]] = m[2];
          }
          const hasId = Boolean(env.GOOGLE_CLIENT_ID);
          const hasSec = Boolean(env.GOOGLE_CLIENT_SECRET);
          const hasUri = Boolean(env.GOOGLE_REDIRECT_URI);
          const hasPsi = Boolean(env.PAGESPEED_API_KEY);
          const hasEnc = Boolean(env.DGS_ENCRYPTION_KEY);

          console.log('GOOGLE_CLIENT_ID=' + (hasId ? 'CONFIGURED' : 'MISSING'));
          console.log('GOOGLE_CLIENT_SECRET=' + (hasSec ? 'CONFIGURED' : 'MISSING'));
          console.log('GOOGLE_REDIRECT_URI=' + (hasUri ? 'CONFIGURED' : 'MISSING'));
          console.log('PAGESPEED_API_KEY=' + (hasPsi ? 'CONFIGURED' : 'MISSING'));
          console.log('DGS_ENCRYPTION_KEY=' + (hasEnc ? 'CONFIGURED' : 'MISSING'));
          console.log('Google CMS state: ' + (hasId && hasSec ? 'WAITING USER AUTHORIZATION' : 'CONFIGURATION REQUIRED'));
          console.log('PageSpeed: ' + (hasPsi ? 'CONFIGURED' : 'FAIL'));

          if (!hasId || !hasSec || !hasUri || !hasPsi || !hasEnc) process.exit(1);
          "
          REMOTE

          if [ "$AUTH_MODE" = key ]; then
            ssh -p "$PROD_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" 'bash -s' < /tmp/remote-verify-integrations.sh
          else
            sshpass -p "$HOSTINGER_PASS" ssh -p "$PROD_PORT" -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" 'bash -s' < /tmp/remote-verify-integrations.sh
          fi
          rm -f /tmp/remote-verify-integrations.sh

          echo "ALL LIVE VERIFICATION CHECKS PASSED!"

      - name: Roll back on verification failure
        if: failure() && env.DEPLOY_SWITCHED == 'true'
        run: |
          if [ "${DEPLOY_SWITCHED:-false}" != "true" ]; then
            echo "Production release was not switched; skipping rollback."
            exit 0
          fi
          echo "Deployment verification failed after release switch. Initiating rollback..."
          cat > /tmp/rollback.sh <<'REMOTE'
          set -euo pipefail
          ROOT=/home/u188101251/production-app
          PREVIOUS="$(cat "$ROOT/previous-before-fa4fdb6.txt" 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
            ln -sfn "$PREVIOUS" "$ROOT/current_rollback"
            mv -Tf "$ROOT/current_rollback" "$ROOT/current"
            touch "$ROOT/current/tmp/restart.txt"
            echo "ROLLED_BACK_TO=$PREVIOUS"
          fi
          REMOTE
          if [ "$AUTH_MODE" = key ]; then
            ssh -p "$PROD_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" 'bash -s' < /tmp/rollback.sh || true
          else
            sshpass -p "$HOSTINGER_PASS" ssh -p "$PROD_PORT" -o ConnectTimeout=15 "$PROD_USER@$PROD_HOST" 'bash -s' < /tmp/rollback.sh || true
          fi
