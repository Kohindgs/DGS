name: DGS Google Search Update Automated Monitor

on:
  schedule:
    # Run every 3 hours at minute 17 to avoid top-of-hour contention
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-search-updates:
    name: Check Google Algorithm & Search Status Feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Internal Monitor Endpoint
        env:
          ENDPOINT_URL: "https://www.dgeniussolutions.com/api/internal/google-updates/check"
          AUTH_SECRET: ${{ secrets.DGS_CRON_SECRET }}
        run: |
          echo "Triggering DGS Google Update Monitor via dedicated cron authentication..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $AUTH_SECRET" \
            -H "Content-Type: application/json" || echo "000")
          
          echo "HTTP Response Code: $HTTP_STATUS"
          if [ -f response.json ]; then
            cat response.json
            echo ""
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Google update monitor failed with HTTP $HTTP_STATUS. Only HTTP 200 is acceptable."
            exit 1
          fi

          echo "Google update monitor completed successfully (HTTP 200)."
